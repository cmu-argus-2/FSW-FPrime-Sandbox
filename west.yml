# West manifest for this F´/Zephyr deployment.
#
# The Zephyr revision and module set are not pinned here. They come from
# FSW-Zephyr-Board-Lib, the board support shared with the C flight software,
# so both projects always build against the same Zephyr. Its west.yml is
# imported below; west takes the first definition of a project it sees, so
# listing `zephyr` in this file would silently override the shared pin.
#
# patches/0002 adapts the fprime-zephyr UART driver to Zephyr 4.4+, where
# uart_irq_update() returns void. Moving the board lib to a Zephyr revision
# that changes that API again means revisiting the patch.

manifest:
  remotes:
    - name: argus
      url-base: https://github.com/cmu-argus-2

  projects:
    - name: FSW-Zephyr-Board-Lib
      remote: argus
      # Exact commit until the board lib starts tagging releases.
      revision: 63979e5705526628dc0c3d44adbcf44ad7f1150f
      path: FSW-Zephyr-Board-Lib
      import:
        # Places the board lib, Zephyr and its modules under
        # lib/zephyr-workspace/, where CMakeLists.txt and .west/config
        # expect them. The prefix applies to this project's own path too.
        path-prefix: lib/zephyr-workspace

  self:
    path: .
